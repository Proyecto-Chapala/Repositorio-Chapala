{% load static %}
{% with ruta=request.resolver_match.url_name %}
<!-- Barra lateral (escritorio). En celular y tablet se cambia por el menú inferior. -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <img class="brand-logo" src="{% static 'operaciones/img/smartmud_icono.png' %}" alt="Smart Mud">
      <span class="brand-text">Smart Mud</span>
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="Menú principal">
    <div class="nav-etiqueta">Operación</div>
    <a class="nav-item {% if 'daily_reports_hub' not in ruta and ruta != 'index' and ruta != 'catalogos_maestros' and ruta != 'pozo_wizard_nuevo' %}active{% endif %}" id="navPozos" href="{% url 'operaciones:pozos_list' %}" title="Pozos">
      <svg class="icono nav-icon" aria-hidden="true"><use href="#i-pozo"></use></svg>
      <span class="nav-text">Pozos</span>
    </a>
    <button type="button" class="nav-item nav-boton {% if 'daily_reports_hub' in ruta %}active{% endif %}" data-abrir-buscador="reportes " title="Reportes por pozo">
      <svg class="icono nav-icon" aria-hidden="true"><use href="#i-reporte"></use></svg>
      <span class="nav-text">Reportes</span>
    </button>
    <a class="nav-item {% if ruta == 'index' %}active{% endif %}" id="navInventario" href="{% url 'operaciones:index' %}" title="Inventario de productos">
      <svg class="icono nav-icon" aria-hidden="true"><use href="#i-inventario"></use></svg>
      <span class="nav-text">Inventario</span>
    </a>
    <a class="nav-item {% if ruta == 'catalogos_maestros' %}active{% endif %}" href="{% url 'operaciones:catalogos_maestros' %}" title="Catálogos maestros: equipos, mallas, propiedades, benchmark y componentes">
      <svg class="icono nav-icon" aria-hidden="true"><use href="#i-catalogo"></use></svg>
      <span class="nav-text">Catálogos</span>
    </a>

    <div class="nav-etiqueta">Acciones</div>
    <a class="nav-item {% if ruta == 'pozo_wizard_nuevo' %}active{% endif %}" href="{% url 'operaciones:pozo_wizard_nuevo' %}" title="Nuevo pozo">
      <svg class="icono nav-icon" aria-hidden="true"><use href="#i-mas"></use></svg>
      <span class="nav-text">Nuevo pozo</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="nav-item" id="toggleSidebarBtn" title="Ocultar / mostrar barra lateral" aria-label="Colapsar barra lateral">
      <svg class="icono nav-icon" aria-hidden="true"><use href="#i-colapsar"></use></svg>
      <span class="nav-text">Colapsar</span>
    </button>
  </div>
</aside>

<!-- Menú inferior (celular y tablet) -->
<nav class="menu-inferior" aria-label="Menú principal">
  <a class="{% if 'daily_reports_hub' not in ruta and ruta != 'index' and ruta != 'catalogos_maestros' and ruta != 'pozo_wizard_nuevo' %}active{% endif %}" href="{% url 'operaciones:pozos_list' %}">
    <svg class="icono" aria-hidden="true"><use href="#i-pozo"></use></svg>Pozos
  </a>
  <button type="button" class="{% if 'daily_reports_hub' in ruta %}active{% endif %}" data-abrir-buscador="reportes ">
    <svg class="icono" aria-hidden="true"><use href="#i-reporte"></use></svg>Reportes
  </button>
  <a class="{% if ruta == 'index' %}active{% endif %}" href="{% url 'operaciones:index' %}">
    <svg class="icono" aria-hidden="true"><use href="#i-inventario"></use></svg>Inventario
  </a>
  <a class="{% if ruta == 'catalogos_maestros' %}active{% endif %}" href="{% url 'operaciones:catalogos_maestros' %}">
    <svg class="icono" aria-hidden="true"><use href="#i-catalogo"></use></svg>Catálogos
  </a>
</nav>
{% endwith %}
