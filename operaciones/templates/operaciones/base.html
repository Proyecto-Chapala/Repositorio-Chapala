{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CHAPALA &bull; Operaciones{% endblock %}</title>
  
  <!-- Tipografía Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos Modulares -->
  <link rel="stylesheet" href="{% static 'operaciones/css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'operaciones/css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'operaciones/css/styles.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <div class="app-container">
    <!-- Componente Sidebar Modular -->
    {% include 'operaciones/componentes/sidebar.html' %}

    <!-- Wrapper Principal -->
    <main class="main-wrapper">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Contenedor Global de Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts Modulares -->
  <script src="{% static 'operaciones/js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
